; =============================================================================
;  Mayavi (ESP32-S3-N16R8)  --  BLE HID emulation + Wi-Fi dashboard
;
;  Firmware for this specific board:
;    16 MB flash / 8 MB octal PSRAM / dual USB (native + CH343 bridge)
;
;  Usage:
;    pio run -e mayavi -t upload      ; firmware
;    pio run -e mayavi -t uploadfs    ; web assets in data/ -> LittleFS
;
;  The old S3 Sentinel sources are kept, unbuilt, in legacy-sentinel/.
; =============================================================================

[platformio]
default_envs = mayavi

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; --- Flash: 16 MB quad (QIO) ---
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; --- PSRAM: 8 MB octal (OPI) ---
board_build.arduino.memory_type = qio_opi

; --- LittleFS for the web UI ---
board_build.filesystem = littlefs

build_flags =
  -DBOARD_HAS_PSRAM

  ; This board has TWO USB ports:
  ;   USB  = ESP32-S3 native  (303a:1001, /dev/ttyACM0)
  ;   UART = CH343 bridge     (1a86:55d3)
  ; Currently plugged into the NATIVE USB port, so Serial must be USB CDC.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

  ; Onboard WS2812 status LED: DevKitC-1 v1.0 = GPIO48, v1.1 = GPIO38.
  -DSTATUS_LED_PIN=48

; =============================================================================
;  Mayavi
; =============================================================================
[env:mayavi]
build_src_filter = +<*>
